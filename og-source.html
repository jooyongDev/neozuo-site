<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>NEOZUO — 공유 이미지</title>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url("/fonts/pretendard-subset.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: Pretendard, sans-serif;
        background: #254bdf;
        color: #fff;
        padding: 52px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      h1 {
        font-size: 38px;
        line-height: 1.45;
        letter-spacing: -0.045em;
        margin: 0;
        font-weight: 600;
      }
      p {
        font-size: 21px;
        line-height: 1.6;
        margin: 0;
        color: #dfe6ff;
      }
      .wordmark {
        font-size: 278px;
        line-height: 0.85;
        font-weight: 800;
        letter-spacing: -0.065em;
        margin-left: -8px;
      }
      footer {
        font-size: 19px;
        color: #dfe6ff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>웹·앱 개발,<br />기획부터 도와드립니다</h1>
      <p>기획부터 개발, 운영까지<br />웹·앱 개발팀</p>
    </header>
    <div class="wordmark">NEOZUO</div>
    <footer>neozuo.com</footer>
  </body>
</html>
