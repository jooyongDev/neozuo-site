<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>NEOZUO 공유 이미지</title>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url("/fonts/pretendard-subset.woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #f5f5f2;
        color: #111;
        font-family: Pretendard, sans-serif;
        padding: 36px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
        align-items: center;
      }
      .copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
      }
      .brand {
        font-size: 36px;
        font-weight: 800;
      }
      h1 {
        font-size: 48px;
        line-height: 1.2;
        letter-spacing: -0.055em;
        margin: 0;
        font-weight: 650;
      }
      p {
        font-size: 24px;
        margin: 0;
      }
      img {
        filter: grayscale(1);
        width: 100%;
        height: auto;
      }
      footer {
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">neozuo</div>
      <div>
        <h1>웹·앱 개발,<br />기획부터 도와드립니다</h1>
        <p style="margin-top: 28px">기획부터 개발, 운영까지</p>
      </div>
      <footer>neozuo.com</footer>
    </div>
    <img src="/assets/hero-art.jpg" alt="NEOZUO 입체 타이포그래피" />
  </body>
</html>
